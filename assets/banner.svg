<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="45%" stop-color="#0d1124" />
      <stop offset="100%" stop-color="#140b29" />
    </linearGradient>

    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" result="blur" />
    </filter>
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="45" result="blur" />
    </filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="35" result="blur" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- DYNAMIC BACKGROUND ELEMENTS: Ambient Glowing Energy Spheres -->
  <g opacity="0.65">
    <!-- Blue/Cyan Orb -->
    <circle cx="150" cy="100" r="130" fill="#3b82f6" filter="url(#glowCyan)">
      <animate attributeName="cx" values="130;200;130" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;150;80" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Purple Center/Right Orb -->
    <circle cx="1020" cy="140" r="140" fill="#8b5cf6" filter="url(#glowPurple)">
      <animate attributeName="cx" values="1020;960;1020" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="140;220;140" dur="11s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="9s" repeatCount="indefinite" />
    </circle>

    <!-- Neon Pink Bottom Orb -->
    <circle cx="650" cy="380" r="120" fill="#ec4899" filter="url(#glowPink)">
      <animate attributeName="cx" values="650;580;650" dur="13s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- DYNAMIC SVG PARTICLES / DATA NODES IN BACKGROUND -->
  <g opacity="0.45">
    <circle cx="280" cy="60" r="2" fill="#60a5fa">
      <animate attributeName="cy" values="60;50;60" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="880" cy="90" r="2.5" fill="#c084fc">
      <animate attributeName="cy" values="90;80;90" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="320" r="2" fill="#f472b6">
      <animate attributeName="cy" values="320;330;320" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="310" r="3" fill="#38bdf8">
      <animate attributeName="cy" values="310;295;310" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTAINER (Guaranteed front depth) -->
  <g id="foreground-content">
    
    <!-- Top Category Badge Pill -->
    <g transform="translate(600, 72)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2" />
      <!-- Pulsing Indicator Dot -->
      <circle cx="-135" cy="0" r="5" fill="#10b981">
        <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-118" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="1">CURATED INTELLIGENCE INDEX</text>
    </g>

    <!-- MAIN TITLE (Foreground Crisp Text) -->
    <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome AI Creative Tools
    </text>

    <!-- SUBTITLE -->
    <text x="600" y="204" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#a5b4fc" letter-spacing="0.5">
      &amp; Computer Vision Ecosystem
    </text>

    <!-- TAGLINE -->
    <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Generative Visual Synthesis • Diffusion Graphs • Neural Inpainting • Matting &amp; Upscaling
    </text>

    <!-- FEATURE PILLS / TAGS (Placed at bottom foreground, clear of title) -->
    <g transform="translate(600, 315)">
      <!-- Pill 1 -->
      <g transform="translate(-450, 0)">
        <rect x="0" y="0" width="165" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff">🎨 Generative Studios</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(-265, 0)">
        <rect x="0" y="0" width="165" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff">🔍 Neural Upscalers</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(-80, 0)">
        <rect x="0" y="0" width="160" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="80" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff">✂️ Matting &amp; SAM 2</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="165" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff">⚡ ComfyUI &amp; Nodes</text>
      </g>

      <!-- Pill 5 -->
      <g transform="translate(285, 0)">
        <rect x="0" y="0" width="165" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff">🎥 Video Synthesis</text>
      </g>
    </g>

    <!-- Bottom border subtle accent -->
    <rect x="150" y="416" width="900" height="2" fill="url(#accentGrad1)" opacity="0.8" rx="1" />
  </g>
</svg>
